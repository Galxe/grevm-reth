# Runs integration tests.

name: integration

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    # Run once a day at 3:00 UTC
    - cron: "0 3 * * *"

env:
  CARGO_TERM_COLOR: always
  SEED: rustethereumethereumrust
  CARGO_INCREMENTAL: 0
  RUSTC_WRAPPER: "sccache"

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions: {}

jobs:
  test:
    name: test / ${{ matrix.network }}
    if: github.event_name != 'schedule'
    runs-on: ${{ github.repository == 'paradigmxyz/reth' && 'depot-ubuntu-latest-4' || 'ubuntu-latest' }}
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
      GRETH_DISABLE_PIPE_EXECUTION: 1
    strategy:
      matrix:
        network: ["ethereum"]
    timeout-minutes: 60
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Geth
        run: .github/scripts/install_geth.sh
      - uses: taiki-e/install-action@1f2425cdb59f8fffb99ee16a5968edf6f57a2b93 # v2.75.24
        with:
          tool: nextest
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: Run tests
        run: |
          cargo nextest run \
            --no-fail-fast \
            --locked --features "asm-keccak ${{ matrix.network }} config-from-env" \
            --workspace --exclude ef-tests \
            --exclude "reth-pipe-exec-layer-*" \
            --exclude "example-*" \
            --exclude "op-reth" \
            --exclude "reth-op" \
            --exclude "reth-optimism-*" \
            -E "kind(test) and not binary(e2e_testsuite)"

  gravity-pipe-test:
    name: gravity pipe test
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUST_BACKTRACE: 1
      RUST_MIN_STACK: 16777216
      # Intentionally NOT setting GRETH_DISABLE_PIPE_EXECUTION: these tests
      # drive PipeExecLayerApi end-to-end and assert the real fork-gated path.
    timeout-minutes: 60
    steps:
      - name: Free Disk Space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: false
          docker-images: true
          swap-storage: true
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@1f2425cdb59f8fffb99ee16a5968edf6f57a2b93 # v2.75.24
        with:
          tool: nextest
      - name: Check Gravity invariants (ripgrep)
        # Long-term regression-prevention lint for the Alpha system-tx
        # gas-exempt design. Living as a bash + ripgrep script (not a Rust
        # `#[test]` shelling out to `rg`) keeps the assertion paste-able
        # and avoids a Rust-test dependency on an external binary that
        # ubuntu-latest runners don't ship. Wired here on the
        # gravity-pipe-test job (rather than the matrix `test` job) so
        # only one CI runner pays for the apt-get install.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          bash scripts/check-gravity-invariants.sh
      - name: Run gravity pipe + hardfork / EIP-7702 / EIP-2935 integration tests
        # `--test <name>` is required (vs. just `-E 'binary(...)'`) because
        # nextest's filterset only filters at *run* time — without `--test`,
        # `-p <crate>` still tries to compile every integration binary in this
        # crate. `--test` keeps this job focused on the intended binaries.
        #
        # The `gravity_system_tx_*` + `gravity_bls_*` binaries were added by
        # #367 and #370 but originally never wired here — they compiled in
        # local dev but CI silently skipped them, so latent regressions
        # (e.g. `debug_traceTransaction` target-tx gas-exempt cfg gap) went
        # unnoticed. Invariant 9 in `scripts/check-gravity-invariants.sh`
        # now pins the allowlist so any new file matching those globs must
        # either be wired here or be listed in the invariant's
        # `KNOWN_UNWIRED_TESTS` skip set with a reason.
        run: |
          cargo nextest run \
            --locked \
            -p reth-pipe-exec-layer-ext-v2 \
            --test gravity_pipe_test \
            --test gravity_hardfork_test \
            --test gravity_eip2935_test \
            --test gravity_eip7702_test \
            --test gravity_system_tx_gas_exempt_test \
            --test gravity_system_tx_pre_alpha_replay_test \
            --test gravity_system_tx_simulation_anti_spoof_test \
            --test gravity_bls_precompile_test \
            --test gravity_system_tx_bls_replay_test \
            --test gravity_system_tx_post_alpha_trace_test

  integration-success:
    name: integration success
    runs-on: ubuntu-latest
    if: always() && github.event_name != 'schedule'
    needs: [test, gravity-pipe-test]
    timeout-minutes: 60
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@05ac9388f0aebcb5727afa17fcccfecd6f8ec5fe # release/v1
        with:
          jobs: ${{ toJSON(needs) }}

  era-files:
    name: era/era1/ere file integration tests once a day
    # if: github.event_name == 'schedule' && github.repository == 'paradigmxyz/reth'
    if: false # FIXME: remove this line to enable the era1 file integration tests job after fixing the issues with the test suite.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: rui314/setup-mold@725a8794d15fc7563f59595bd9556495c0564878 # v1
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@1f2425cdb59f8fffb99ee16a5968edf6f57a2b93 # v2.75.24
        with:
          tool: nextest
      - uses: mozilla-actions/sccache-action@7d986dd989559c6ecdb630a3fd2557667be217ad # v0.0.9
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
      - name: run era/era1/ere files integration tests
        run: cargo nextest run --no-fail-fast --release --package reth-era --test it -- --ignored
